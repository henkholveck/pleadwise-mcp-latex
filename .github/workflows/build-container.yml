name: Build and Push Container
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/henkholveck/pleadwise-mcp-latex:latest
            ghcr.io/henkholveck/pleadwise-mcp-latex:${{ github.sha }}
      - name: Verify container pipeline (strict)
        run: |
          docker run --rm --name pleadwise-test -d -p 8080:8080 ghcr.io/henkholveck/pleadwise-mcp-latex:${{ github.sha }}
          sleep 15
          curl -sf http://localhost:8080/health | grep -q '"ok":true' || (echo "Health check failed"; docker logs pleadwise-test; exit 1)
          echo "Server healthy; /health returns ok:true; real verification relies on deployed endpoint test"
