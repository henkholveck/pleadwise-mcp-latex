app = "pleadwise-mcp-latex"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[env]
  TEX_ENGINE = "pdflatex"
  PLUGON_WIRE = "stub-only; format_document/render_preview reference only; plugon source missing"
